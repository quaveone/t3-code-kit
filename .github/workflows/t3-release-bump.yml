name: Upstream stable bump

# Follows T3 Code stable releases and the Claude Code `stable` channel, with no human step:
#   new version -> update image/Dockerfile -> build, smoke test, bridge contract test -> commit to main
#   -> dispatch CI on main, which publishes the images, moves :stable and creates the release.
# A bump that fails a test is not committed; it opens (or updates) an issue instead.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-bump
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Compare pinned versions with upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t3_latest="$(gh api repos/pingdotgg/t3code/releases/latest --jq .tag_name | sed 's/^v//')"
          t3_pinned="$(sed -n 's/^ARG T3_VERSION=//p' image/Dockerfile)"
          claude_stable="$(npm view @anthropic-ai/claude-code dist-tags.stable)"
          claude_pinned="$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' image/Dockerfile)"
          echo "T3 ${t3_pinned} -> ${t3_latest}; Claude Code ${claude_pinned} -> ${claude_stable}"
          {
            echo "t3=$t3_latest"; echo "claude=$claude_stable"
            [ "$t3_latest" != "$t3_pinned" ] || [ "$claude_stable" != "$claude_pinned" ] && echo "changed=true" || echo "changed=false"
          } >> "$GITHUB_OUTPUT"
      - name: Apply and test the bump
        if: steps.check.outputs.changed == 'true'
        id: test
        env:
          T3: ${{ steps.check.outputs.t3 }}
          CLAUDE: ${{ steps.check.outputs.claude }}
        run: |
          sed -i "s/^ARG T3_VERSION=.*/ARG T3_VERSION=${T3}/; s/^ARG CLAUDE_CODE_VERSION=.*/ARG CLAUDE_CODE_VERSION=${CLAUDE}/" image/Dockerfile
          docker build -t t3-code:bump image
          scripts/smoke-image.sh t3-code:bump
          (cd bridge && bun install --frozen-lockfile)
          scripts/bridge-contract-test.sh t3-code:bump
      - name: Commit to main and release
        if: steps.check.outputs.changed == 'true' && steps.test.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          T3: ${{ steps.check.outputs.t3 }}
          CLAUDE: ${{ steps.check.outputs.claude }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(image): T3 Code ${T3}, Claude Code ${CLAUDE}"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN do not trigger workflows; a dispatch does.
          # Retry: the commit is already on main, so a lost dispatch would leave it unpublished.
          for attempt in 1 2 3 4 5; do
            gh workflow run ci.yml --ref main && break
            [ "$attempt" -lt 5 ] || exit 1
            sleep 30
          done
      - name: Report a failed bump
        if: failure() && steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          T3: ${{ steps.check.outputs.t3 }}
          CLAUDE: ${{ steps.check.outputs.claude }}
        run: |
          title="Upstream bump failed: T3 Code ${T3} / Claude Code ${CLAUDE}"
          body="The scheduled bump did not pass its tests, so nothing was published. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num="$(gh issue list --state open --search "in:title \"${title}\"" --json number --jq '.[0].number')"
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
